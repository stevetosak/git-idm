name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag == ''
        run: echo "No feature or fix commits since the last release, nothing to release."
      - if: steps.version.outputs.tag != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: steps.version.outputs.tag != ''
        run: sudo apt-get update && sudo apt-get install -y zsh
      - if: steps.version.outputs.tag != '' && steps.version.outputs.bump != 'existing'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          "/opt/homebrew/Caskroom/snip/0.20.0/snip" run -- git tag "$TAG"
          "/opt/homebrew/Caskroom/snip/0.20.0/snip" run -- git push origin "$TAG"
      - if: steps.version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
